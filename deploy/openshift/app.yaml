apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-postgres
  labels:
    app: inventory-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inventory-postgres
  template:
    metadata:
      labels:
        app: inventory-postgres
    spec:
      containers:
        - name: postgres
          image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: inventory-db-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inventory-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-postgres
  labels:
    app: inventory-postgres
spec:
  selector:
    app: inventory-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
  labels:
    app: inventory-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      initContainers:
        - name: migrate-and-seed
          image: image-registry.openshift-image-registry.svc:5000/inventory-management/inventory-app:latest
          imagePullPolicy: Always
          workingDir: /opt/app-root/src/backend
          command:
            - /bin/sh
            - -c
            - alembic upgrade head && python /opt/app-root/src/scripts/seed-demo-data.py
          env:
            - name: PG_HOST
              value: inventory-postgres
            - name: PG_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: inventory-db-secret
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/inventory-management/inventory-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PG_HOST
              value: inventory-postgres
            - name: PG_PORT
              value: "5432"
            - name: CORS_ORIGINS
              value: "*"
          envFrom:
            - secretRef:
                name: inventory-db-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-app
  labels:
    app: inventory-app
spec:
  selector:
    app: inventory-app
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: inventory
  labels:
    app: inventory-app
spec:
  to:
    kind: Service
    name: inventory-app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
