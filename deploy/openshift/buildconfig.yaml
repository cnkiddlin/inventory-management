apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: inventory-app
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: inventory-app
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: deploy/openshift/backend.Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: inventory-app:latest
  triggers: []
